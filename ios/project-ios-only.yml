name: CrewSafetyIOSOnly
options:
  bundleIdPrefix: org.crewsafety.hackathon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""

targets:
  CrewSafety:
    type: application
    platform: iOS
    sources:
      - path: CrewSafety
      - path: CrewSafetyShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.crewsafety.hackathon.CrewSafety
        PRODUCT_NAME: CrewSafety
        INFOPLIST_FILE: CrewSafety-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: CrewSafety.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        INFOPLIST_KEY_CFBundleDisplayName: CrewSafety
        INFOPLIST_KEY_NSCameraUsageDescription: "Used on-device to check whether a crew member is moving. Video is not stored or sent."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Reads heart rate, heart rate variability, resting heart rate, breathing rate, blood oxygen and ECG recordings from your Apple Watch, to show them next to camera alerts and compare them with your own usual range. They stay on this iPhone and never decide an alert."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Starts a monitoring session on your Apple Watch so heart rate arrives every few seconds. The session is discarded, not saved as a workout."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connect to your computer's CrewSafety dashboard to share crew status and safety alerts."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Used to hear whether you're OK after no movement is detected. Audio stays on this device unless you turn on the voice agent in Settings, which sends it to ElevenLabs during a check-in."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Used on-device to recognise \"I'm okay\" or \"help\" after no movement is detected. Audio is not stored or sent."
        SWIFT_EMIT_LOC_STRINGS: "YES"

  CrewSafetyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CrewSafetyTests
    dependencies:
      - target: CrewSafety
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.crewsafety.hackathon.CrewSafetyTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CrewSafety.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CrewSafety"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  CrewSafety-iOSOnly:
    build:
      targets:
        CrewSafety: all
        CrewSafetyTests: [test]
    test:
      targets:
        - CrewSafetyTests
